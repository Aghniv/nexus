spring.application.name=Nexus

server.port=4040
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

secreteJwtString=${JWT_SECRET:defaultJwtSecret}

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

stripe.api.public.key=${STRIPE_PUBLIC_KEY:pk_test_placeholder
stripe.api.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder

spring.profiles.active=prod